[project]
name = "databricks-medallion-lakehouse"
version = "0.1.0"
description = "Bronze / silver / gold lakehouse pipeline with a Delta-style layout and data quality checks."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Rajesh Kumar Rajput", email = "Rajesh.rajput97@gmail.com" }]
dependencies = ["pandas>=2.0", "pyarrow>=14"]

[project.optional-dependencies]
dev = ["pytest>=8"]
spark = ["pyspark>=3.5"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
